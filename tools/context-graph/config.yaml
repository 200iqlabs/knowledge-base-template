# context-graph configuration — neutral default shipped with the template.
#
# The script lives next to this file and is invoked with the consuming repository's own
# config, the way context-lint is:
#   python template/tools/context-graph/graph.py stats --config tools/context-graph/config.yaml
# This copy is what the tool falls back to when no config is passed, so it has to work in
# a repository that has only the template's skeleton — and it names no real project.

# Where Markdown files are looked for. Everything below these roots that git tracks and
# that ends in .md becomes a node.
scan_roots:
  - context

# Graph, hash cache and report. Expected to be ignored by git: the graph is fully
# reproducible from the files that ARE in the repository, so history carries the cause
# and not the effect — and a committed state file would be a conflict factory in a
# repository worked on from several sessions at once.
state_dir: context/.graph

# The orphan exemption rule and the scope boundaries are already declared by the linter
# in a repository that runs one. Reading them from there keeps one source of truth
# instead of a second copy that drifts — the same borrowing the linter does for the
# task-registry contract. Unreadable or absent, the inline values below apply.
lint_config: tools/context-lint/config.yaml

# Inline fallbacks, used only when lint_config cannot be read.
#
# self_index_marker — a subtree holding this file indexes itself, so a file inside it is
# reachable without an inbound link from outside. The ancestor walk stops at the entity
# root: a scope-level index lists entities, not their internals.
self_index_marker: _index.md
# Directories referenced as a folder rather than file by file.
exclude_dirs:
  - output
  - archive
  - inbox
  - tasks
# Scope roots whose immediate subdirectories are entity roots.
entity_scopes:
  - context/projects

thresholds:
  # How long a first build may take before `stats --line` reports the graph as absent
  # instead of waiting. A status line must never be the reason a prompt hangs.
  build_seconds: 30
