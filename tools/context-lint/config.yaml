# context-lint — default configuration.
#
# Deliberately minimal: one scope, the conventions the rules describe, nothing else.
# Grow it as your knowledge base grows — every value here is a knob, not a constant
# in the script. See README.md for the check catalogue and what each key controls.
#
# A repo that keeps its knowledge base somewhere else passes its own file instead:
#   python tools/context-lint/lint.py --config path/to/config.yaml

# Folder-shaped scopes. Each root holds entity folders — one folder per project,
# client, customer, or whatever else you track. Add a root per scope you keep.
scan_roots:
  - name: projects
    path: context/projects
    required_files: [project.md, status.md, catalog.md]
    index: _index.md

# File-shaped scopes: one .md per entity, no folder. Only the index<->files check
# applies to the entities themselves — but check #22 walks these trees too, because the
# `_index.md` at the root of a file-shaped scope is an index like any other.
# Leave empty until you have a scope shaped that way.
file_scopes: []

thresholds:
  freshness_days: 30            # check #4: warn when 'updated:' / 'Last updated' is older
  status_max_lines: 80          # check #8: warn when status.md exceeds this many lines
  status_closed_rows_kept: 15   # check #16: how many 🟢 rows status.md keeps before
                                # /close-session ages the rest into status_archive.md.
                                # A row is not a day — a busy day closes several at once,
                                # so a count of 10 can mean two days rather than two weeks.
                                # 15 buys roughly a fortnight of living board.
  status_row_max_chars: 1000    # check #17: how long a single 🟢 row may get. A closed
                                # row is a headline with a link into data/, and length is
                                # what it actually costs to read. Calibrated on a real
                                # board: median 356, p75 933 — so 1000 lets three
                                # quarters through and catches the ones that grew into a
                                # paragraph. Tighten later once the outliers are gone.
  catalog_row_max_chars: 1000   # check #21: how long a single entry in catalog.md may
                                # get. Deliberately equal to status_row_max_chars above:
                                # the two mean the same thing — an entry is a headline
                                # saying what a file is and why to open it — and two
                                # thresholds with one meaning and two values are two
                                # thresholds somebody eventually confuses.

# check #21: entities whose catalog.md is not checked for entry length, each with the
# reason it is exempt. The reason is required, not decoration: an exception without one
# is indistinguishable from an oversight, and nobody can tell later whether it still
# holds. Empty in the template — an entity name is a fact about a repository, never
# about the template it grew from.
catalog_row_length_exclude: {}

# check #22: further trees to walk for `_index.md`, beyond the scopes declared above.
# The scan roots, file scopes and the task registry cover the scopes the rest of the
# linter knows about, and an index can sit outside all of them — a generated one under
# an operations tree, say. Naming those trees here keeps the guard's reach a line of
# configuration instead of a directory name compiled into the template, which does not
# own the layout of any repository built from it. Empty: the template declares one
# scope and it is already covered.
index_log_roots: []

# check #6: filename substrings that mark a sent message living in the wrong place.
# A file named like a message belongs in communication/, not in deliverables/.
communication_patterns:
  - "-wa-"
  - "-mail-"
  - "-email-"
  - "-message-"
  - "-linkedin-"

# Directories excluded from the catalog<->files check (#1): referenced by folder,
# not file by file. Add any directory that fills up mechanically — generated runs,
# bulk exports, evaluation sheets — because nobody catalogues those one by one.
catalog_exclude_dirs:
  - output
  - archive
  - inbox
  - tasks

# check #1 forward: only these file types are mapped per-file in catalog.md.
catalog_check_extensions: [".md"]

# A subtree containing this file catalogues itself: check #1 stops at its boundary
# and instead requires the entity's catalog.md to name the folder. Naming the rule
# beats listing exceptions — it holds for subtrees that do not exist yet.
self_index_marker: _index.md

# Directories whose files must carry a YYYY-MM-DD date prefix (check #3).
date_prefix_dirs: [communication, archive]

# Directory name treated as sent-message storage (checks #3, #7).
communication_dir: communication

# Structural files that are never catalogued content (skipped by check #1).
structural_files:
  - status.md
  - status_archive.md
  - catalog.md
  - project.md
  - README.md
  - CLAUDE.md
  - AGENTS.md

# Files whose freshness is tracked by check #4. Only the living board: a stale
# status.md is signal, while a reference anchor is stable by design, so flagging
# it after 30 days would be noise.
freshness_files:
  - status.md

# check #3: filenames exempt from the date-prefix rule (glob patterns, basename).
name_exceptions:
  - "README.md"
  - "_*.md"

# check #6: files allowed to keep a communication-like name inside deliverables/
# (false positives: process docs that merely contain 'mail' as a word).
deliverables_comm_exceptions: []

# checks #10–#12: task registry. Allowed header values and directory layout are NOT
# repeated here — they live in the schema file below, which the registry generator
# reads as well. A second copy of the enums would drift the first time somebody
# added a value to one of them.
task_registry:
  schema: tools/tasks/schema.yaml

# check #20: the orphan check, which is the link graph's answer rather than a second
# implementation of it. Wired here so a repository made from this template runs the check
# from its first commit: the template ships the graph tool, check #19 already reports dead
# links without being configured at all, and a check that silently does not run is the one
# thing a linter must never look like. The path is where this file's own neighbour lands —
# the template's contents ARE the root of the repository made from it.
link_graph:
  config: tools/context-graph/config.yaml
  # How many orphans are listed one by one before the rest become a single count. About
  # readability, not tolerance: every orphan is in the graph tool's own report, and the
  # point here is that a long list does not bury the other checks.
  orphan_findings_listed: 20

# Checks belonging to the repository that consumes this template, run alongside the core
# ones. Empty by default, and an empty list changes nothing about the output. Each entry:
#   - label: short name, shown in the result as `<label>:<check>`
#     command: [python, tools/<something>/check.py]   # or a single string
#     path: context/<subtree>    # optional: only run when a scoped lint covers it
#     timeout: 120               # optional, seconds
# The command prints findings in this tool's text format (level, check, path, message,
# tab-separated) and exits 0 clean / 1 when its findings include an ERROR. This is the
# seam that keeps domain knowledge out of the template: a check that has to name a real
# scope of the consuming repo lives there, and is wired in here.
external_checks: []
